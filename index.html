<!DOCTYPE html>
<html lang="ko" data-theme="classic">
<head>
<title>Date Calculator - 날짜계산기</title>
<meta charset="utf-8" />
<meta name="google-site-verification" content="o3ldpgTrVPqeu0HAA0WNDLqamEzIwvIK1zevYZ5WQjQ" />
<meta property="og:type" content="website">
<meta property="og:title" content="Date Calculator for PM">
<meta property="og:description" content="You can calculate the date in years, weeks and days.">
<meta property="og:image" content="https://anitooni.github.io/DateCalculator/dateCalculator.jpg">
<meta property="og:url" content="https://anitooni.github.io/DateCalculator/">

<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta http-equiv="ScreenOrientation" content="autoRotate:disabled">

<script>
  try {
    var savedTheme = localStorage.getItem('dc_theme');
    if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
    var savedFont = localStorage.getItem('dc_font');
    if (savedFont) document.documentElement.setAttribute('data-font', savedFont);
  } catch (_) {}
</script>

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<link href="./mainScreen.css" rel="stylesheet">
<link href="./gapCalculator.css" rel="stylesheet">
<link href="./toolTip.css" rel="stylesheet">
<link href="./years4_calendar.css" rel="stylesheet">

<script src="./holiday.js" defer></script>
<script src="./calendarCore.js" defer></script>
<script src="./years4_calendar.js" defer></script>
<script src="./datePicker.js" defer></script>
<script src="./calculate.js" defer></script>
<script type="module" src="./con_counter.js"></script>
</head>

<body>
  <nav>
    <div class="nav-inner">
      <div class="mobile-brand mobile-only">Date Calculator</div>
      <div class="nav-tabs">
        <a href="#end-date" class="on" id="menu1" data-tab="menu1"><i class="fa-regular fa-calendar mobile-only"></i><span>End Date Calculator</span></a>
        <a href="#4-years" id="menu2" data-tab="menu2"><i class="fa-solid fa-calendar-days mobile-only"></i><span>4-Years Calendar</span></a>
        <a href="#duration" id="menu3" data-tab="menu3"><i class="fa-solid fa-hourglass-half mobile-only"></i><span>Duration Calculator</span></a>
        <span class="nav-indicator"></span>
      </div>
      <div class="nav-controls" id="nav_controls">
        <div class="font-control">
          <i class="fa-solid fa-font" aria-hidden="true"></i>
          <select id="font_selector" aria-label="Number Font">
            <option value="plex">IBM Plex Sans</option>
            <option value="jetbrains">JetBrains Mono</option>
            <option value="inter">Inter</option>
          </select>
        </div>
        <div class="theme-control">
          <i class="fa-solid fa-palette" aria-hidden="true"></i>
          <select id="theme_selector" aria-label="Color Theme">
            <option value="classic">Classic</option>
            <option value="pure-edge">Pure &amp; Edge</option>
            <option value="saas">Clean SaaS</option>
            <option value="dark">Pro Dark</option>
            <option value="bento">Warm Bento</option>
          </select>
        </div>
        <div class="region-control">
          <i class="fa-solid fa-globe" aria-hidden="true"></i>
          <select id="region_selector" aria-label="Region and Holiday Calendar">
            <option value="KR">🇰🇷 Korea (KR)</option>
            <option value="JP">🇯🇵 Japan (JP)</option>
            <option value="DE">🇩🇪 Germany (DE)</option>
            <option value="US">🇺🇸 United States (US)</option>
            <option value="IN">🇮🇳 India (IN)</option>
            <option value="CN">🇨🇳 China (CN)</option>
          </select>
        </div>
      </div>
      <button type="button" id="mobile_settings_btn" class="mobile-only" aria-label="Display Settings"><i class="fa-solid fa-sliders"></i></button>
    </div>
  </nav>

  <div id="container">
    <div id="end_date_calculator">
      <div id="calculate">
        <div id="selected_div">
          <div class="indicator">START DATE</div>
          <div><label id="selected_date"></label></div>
        </div>

        <div class="btn_info btn_info_bar">
          <span>Click to copy</span>
          <label class="include-year-label">
            <input type="checkbox" class="include-year-chk">
            <span>Include Year</span>
          </label>
        </div>
        <div class="copyButton">
          <div class="cBtn"><div class="txt" id="f1-1"></div></div>
          <div class="cBtn"><div class="txt" id="f1-2"></div></div>
          <div class="cBtn"><div class="txt" id="f1-3"></div></div>
          <div class="cBtn"><div class="txt" id="f1-4"></div></div>
          <div class="cBtn"><div class="txt" id="f1-5"></div></div>
          <div class="cBtn"><div class="txt" id="f1-6"></div></div>
        </div>

        <div id="direction_down1"><i class="fa-solid fa-chevron-down"></i></div>

        <div class="offset-group">
          <div id="yearCont_div">
            <span class="offset-plus">+</span>
            <div class="num-stepper">
              <input type="number" id="yearCont" min="-30" max="30" value="0">
              <div class="stepper-btns">
                <button type="button" class="step-btn" data-target="yearCont" data-step="1" aria-label="Increase years"><i class="fa-solid fa-caret-up"></i></button>
                <button type="button" class="step-btn" data-target="yearCont" data-step="-1" aria-label="Decrease years"><i class="fa-solid fa-caret-down"></i></button>
              </div>
            </div>
            <span class="offset-unit">year(s)</span>
          </div>
          <div id="weekCont_div">
            <span class="offset-plus">+</span>
            <div class="num-stepper">
              <input type="number" id="weekCont" min="-200" max="200" value="0">
              <div class="stepper-btns">
                <button type="button" class="step-btn" data-target="weekCont" data-step="1" aria-label="Increase weeks"><i class="fa-solid fa-caret-up"></i></button>
                <button type="button" class="step-btn" data-target="weekCont" data-step="-1" aria-label="Decrease weeks"><i class="fa-solid fa-caret-down"></i></button>
              </div>
            </div>
            <span class="offset-unit">week(s)</span>
          </div>
          <div id="dayCont_div">
            <span class="offset-plus">+</span>
            <div class="num-stepper">
              <input type="number" id="dayCont" min="-3000" max="3000" value="0">
              <div class="stepper-btns">
                <button type="button" class="step-btn" data-target="dayCont" data-step="1" aria-label="Increase days"><i class="fa-solid fa-caret-up"></i></button>
                <button type="button" class="step-btn" data-target="dayCont" data-step="-1" aria-label="Decrease days"><i class="fa-solid fa-caret-down"></i></button>
              </div>
            </div>
            <span class="offset-unit">day(s)</span>
          </div>
        </div>

        <div id="direction_down2"><i class="fa-solid fa-chevron-down"></i></div>

        <div class="end-date-group">
          <div id="calculated_div" title="Click to move END DATE to START DATE">
            <div class="indicator">END DATE</div>
            <div><label id="calculated_date"></label></div>
            <div id="holiday">Working day</div>
          </div>

          <div id="global_holiday">
            <div class="global-holiday-row"><div class="country-code">KR:</div><div class="country-result">Working day</div></div>
            <div class="global-holiday-row"><div class="country-code">JP:</div><div class="country-result">Working day</div></div>
            <div class="global-holiday-row"><div class="country-code">DE:</div><div class="country-result">Working day</div></div>
            <div class="global-holiday-row"><div class="country-code">US:</div><div class="country-result">Working day</div></div>
            <div class="global-holiday-row"><div class="country-code">IN:</div><div class="country-result">Working day</div></div>
            <div class="global-holiday-row"><div class="country-code">CN:</div><div class="country-result">Working day</div></div>
          </div>
        </div>

        <div class="btn_info btn_info_bar">
          <span>Click to copy</span>
          <label class="include-year-label">
            <input type="checkbox" class="include-year-chk">
            <span>Include Year</span>
          </label>
        </div>
        <div class="copyButton">
          <div class="cBtn"><div class="txt" id="f2-1"></div></div>
          <div class="cBtn"><div class="txt" id="f2-2"></div></div>
          <div class="cBtn"><div class="txt" id="f2-3"></div></div>
          <div class="cBtn"><div class="txt" id="f2-4"></div></div>
          <div class="cBtn"><div class="txt" id="f2-5"></div></div>
          <div class="cBtn"><div class="txt" id="f2-6"></div></div>
        </div>
      </div>

      <div id="calCanvas">
        <div id="year">
          <div id="yearSelector">
            <div id="prev"><i class="fa-solid fa-angles-left"></i></div>
            <div id="selected_year"></div>
            <div id="next"><i class="fa-solid fa-angles-right"></i></div>
          </div>
          <div id="viewToday">
            <div id="showToday">Today: YYYY-MM-DD</div>
          </div>
        </div>

        <div id="mobile_month_nav" class="mobile-only">
          <button type="button" id="mobile_prev_month" aria-label="Previous Month"><i class="fa-solid fa-chevron-left"></i></button>
          <div id="mobile_month_label"></div>
          <button type="button" id="mobile_next_month" aria-label="Next Month"><i class="fa-solid fa-chevron-right"></i></button>
          <button type="button" id="mobile_today_btn">Today</button>
        </div>

        <div id="viewCal">
          <div id="Jan"></div> <div id="Feb"></div> <div id="Mar"></div> <div id="Apr"></div>
          <div id="May"></div> <div id="Jun"></div> <div id="Jul"></div> <div id="Aug"></div>
          <div id="Sep"></div> <div id="Oct"></div> <div id="Nov"></div> <div id="Dec"></div>
        </div>
      </div>
    </div>

    <div id="cal_4y">
      <div id="mobile_4y_nav" class="mobile-only">
        <button type="button" class="year-chip" data-scroll-target="year_row_1"></button>
        <button type="button" class="year-chip" data-scroll-target="year_row_2"></button>
        <button type="button" class="year-chip" data-scroll-target="year_row_3"></button>
        <button type="button" class="year-chip" data-scroll-target="year_row_4"></button>
      </div>
      <div class="year-row" id="year_row_1">
        <div id="year_1"></div>
        <div id="viewCal_y1">
          <div id="Jan_y1"></div> <div id="Feb_y1"></div> <div id="Mar_y1"></div> <div id="Apr_y1"></div> <div id="May_y1"></div> <div id="Jun_y1"></div>
          <div id="Jul_y1"></div> <div id="Aug_y1"></div> <div id="Sep_y1"></div> <div id="Oct_y1"></div> <div id="Nov_y1"></div> <div id="Dec_y1"></div>
        </div>
        <div class="year-scroll-wrap">
          <div class="year-scroll-btns">
            <button type="button" class="year-scroll-btn scroll-down" data-scroll-target="year_row_2" aria-label="Next year"><i class="fa-solid fa-chevron-down"></i></button>
          </div>
        </div>
      </div>

      <div class="year-row" id="year_row_2">
        <div id="year_2"></div>
        <div id="viewCal_y2">
          <div id="Jan_y2"></div> <div id="Feb_y2"></div> <div id="Mar_y2"></div> <div id="Apr_y2"></div> <div id="May_y2"></div> <div id="Jun_y2"></div>
          <div id="Jul_y2"></div> <div id="Aug_y2"></div> <div id="Sep_y2"></div> <div id="Oct_y2"></div> <div id="Nov_y2"></div> <div id="Dec_y2"></div>
        </div>
        <div class="year-scroll-wrap">
          <div class="year-scroll-btns">
            <button type="button" class="year-scroll-btn scroll-up" data-scroll-target="year_row_1" aria-label="Previous year"><i class="fa-solid fa-chevron-up"></i></button>
            <button type="button" class="year-scroll-btn scroll-down" data-scroll-target="year_row_3" aria-label="Next year"><i class="fa-solid fa-chevron-down"></i></button>
          </div>
        </div>
      </div>

      <div class="year-row" id="year_row_3">
        <div id="year_3"></div>
        <div id="viewCal_y3">
          <div id="Jan_y3"></div> <div id="Feb_y3"></div> <div id="Mar_y3"></div> <div id="Apr_y3"></div> <div id="May_y3"></div> <div id="Jun_y3"></div>
          <div id="Jul_y3"></div> <div id="Aug_y3"></div> <div id="Sep_y3"></div> <div id="Oct_y3"></div> <div id="Nov_y3"></div> <div id="Dec_y3"></div>
        </div>
        <div class="year-scroll-wrap">
          <div class="year-scroll-btns">
            <button type="button" class="year-scroll-btn scroll-up" data-scroll-target="year_row_2" aria-label="Previous year"><i class="fa-solid fa-chevron-up"></i></button>
            <button type="button" class="year-scroll-btn scroll-down" data-scroll-target="year_row_4" aria-label="Next year"><i class="fa-solid fa-chevron-down"></i></button>
          </div>
        </div>
      </div>

      <div class="year-row" id="year_row_4">
        <div id="year_4"></div>
        <div id="viewCal_y4">
          <div id="Jan_y4"></div> <div id="Feb_y4"></div> <div id="Mar_y4"></div> <div id="Apr_y4"></div> <div id="May_y4"></div> <div id="Jun_y4"></div>
          <div id="Jul_y4"></div> <div id="Aug_y4"></div> <div id="Sep_y4"></div> <div id="Oct_y4"></div> <div id="Nov_y4"></div> <div id="Dec_y4"></div>
        </div>
        <div class="year-scroll-wrap">
          <div class="year-scroll-btns">
            <button type="button" class="year-scroll-btn scroll-up" data-scroll-target="year_row_3" aria-label="Previous year"><i class="fa-solid fa-chevron-up"></i></button>
            <button type="button" class="year-scroll-btn scroll-up" data-scroll-target="year_row_1" aria-label="Back to first year" title="Top"><i class="fa-solid fa-angles-up"></i></button>
          </div>
        </div>
      </div>
    </div>

    <div id="gap_calculate">
      <div id="start_to_end">
        <div id="startDate_div">
          <div class="gap_indicator">START DATE</div>
          <div><input type="text" id="start_datepicker" inputmode="numeric" autocomplete="off"></div>
          <div id="start_picker_box"></div>
        </div>

        <div id="minus"><i class="fas fa-minus"></i></div>

        <div id="endDate_div">
          <div class="gap_indicator">END DATE</div>
          <div><input type="text" id="end_datepicker" inputmode="numeric" autocomplete="off"></div>
          <div id="end_picker_box"></div>
        </div>
      </div>

      <div id="cal_result">
        <div id="result-all"></div>
        <div id="result-month"></div>
        <div id="result-week"></div>
        <div id="result-day"></div>
      </div>
    </div>
  </div>

  <div id="holiday-tooltip" role="tooltip"></div>
  <div id="toast-container" aria-live="polite"></div>
</body>
</html>
